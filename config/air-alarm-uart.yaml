# Adafruit Feather ESP32 v2 — air-alarm variant with two TCP-bridged UARTs
# (control @ 115200, data @ 921600) exposed via tube0013/esphome-stream-server-v2.
# Identity (device_id, device_num, location) is set at runtime via the
# esphome.<mac-name>.provision service call from HA Developer Tools.

substitutions:
  firmware_version: "dev"   # overridden by deploy-uart.ps1 via: esphome -s firmware_version <ver> compile
  # Overrides the default in air-alarm-common.yaml so this variant's OTA
  # URL points at air-alarm-uart.bin (the regular four devices keep
  # fetching air-alarm.bin via the common default).
  firmware_basename: "air-alarm-uart"

esphome:
  name: air-alarm-uart
  friendly_name: Air Alarm (UART)
#  name_add_mac_suffix: true

packages:
  - !include common/air-alarm-feather.yaml
  - !include common/air-alarm-common.yaml
  - !include common/esp_common_core.yaml
  - !include common/air-alarm-identity.yaml
  - !include common/air-alarm-uart-streams.yaml
