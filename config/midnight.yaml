esphome:
  name: midnight
  friendly_name: "Midnight"
  platformio_options:
    # OpenOCD debugging defaults (override per env if you use a different probe)
    debug_tool: esp-builtin
    upload_protocol: esptool
    debug_speed: 20000
    debug_init_break: tbreak app_main
    debug_extra_cmds:
      - set gdb_memory_map disable
    build_type: debug
    board_build.mcu: esp32c5
    board_build.variant: esp32c5
    board_build.f_cpu: 240000000
    build_unflags: -Os
    build_flags:
      - -Og
      - -g3
      - -ggdb3

esp32:
  board: esp32-c5-devkitc1-n8r4
  variant: ESP32C5
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  # baud_rate: 115200
  # hardware_uart: UART0

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Midnight Fallback Hotspot"
    password: !secret wifi_password
  on_connect:
    then:
      - light.turn_on:
          id: status_led
          red: 0%
          green: 0%
          blue: 100%
          brightness: 30%
  on_disconnect:
    then:
      - light.turn_on:
          id: status_led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 30%

captive_portal:

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: GPIO27
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
