# Platform package for Adafruit Feather ESP32 v2 (ESP-IDF framework)
#
# publish_mqtt_discovery delegates entirely to publish_ens220_discovery since
# the Feather has no onboard temperature/humidity/pressure sensors.

esp32:
  board: adafruit_feather_esp32_v2
  framework:
    type: esp-idf

logger:
  level: INFO
  logs:
    sensor: INFO
    i2c.idf: WARN
    ens220: INFO

i2c:
  sda: GPIO22
  scl: GPIO20
  frequency: 400kHz

switch:
  - platform: gpio
    id: neopixel_i2c_power
    name: "NeoPixel I2C Power"
    pin: GPIO2
    restore_mode: ALWAYS_ON

light:
  - platform: esp32_rmt_led_strip
    id: status_light
    rgb_order: GRB
    chipset: WS2812
    pin: 0
    num_leds: 1
    name: "Status Light"

output:
  - platform: gpio
    id: red_light
    pin: GPIO13

esphome:
  on_boot:
    priority: -100   # after NVS globals are restored
    then:
      - if:
          condition:
            lambda: 'return !id(g_provisioned);'
          then:
            - light.turn_on:
                id: status_light
                red: 1.0
                green: 0.45
                blue: 0.0
                brightness: 0.5
                transition_length: 0s

interval:
  # Restore orange after any event flash clears it, while unprovisioned.
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return !id(g_provisioned);'
          then:
            - light.turn_on:
                id: status_light
                red: 1.0
                green: 0.45
                blue: 0.0
                brightness: 0.5
                transition_length: 0s

script:
  - id: publish_mqtt_discovery
    mode: single
    then:
      - light.turn_off:       # clear the unprovisioned orange indicator
          id: status_light
          transition_length: 0s
      - script.execute: publish_ens220_discovery
