# Platform package for Adafruit Feather ESP32 v2 (ESP-IDF framework)
#
# LED state machine (g_led_state):
#   0 = IDLE — orange (unprovisioned) or cyan (provisioned + wifi)
#   1 = EVENT_POSITIVE — green, 300ms burst (door opened / positive pressure)
#   2 = EVENT_NEGATIVE — blue,  300ms burst (door closed / negative pressure)
#   3 = OTA — purple (firmware update started, stays until reboot)
#
# ALL led changes funnel through led_refresh. Never call light.turn_on
# directly from other automations — set g_led_state and call led_refresh.

esp32:
  board: adafruit_feather_esp32_v2
  framework:
    type: esp-idf
    sdkconfig_options:
      # Enable vTaskList() and vTaskGetRunTimeStats() for MQTT task monitoring.
      # vTaskList():        name, state (R/B/S), priority, stack-hwm, task-num
      # vTaskGetRunTimeStats(): abs + % CPU time per task since boot
      CONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS: "y"
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: "y"

logger:
  level: INFO
  logs:
    sensor: INFO
    i2c.idf: WARN
    ens220: INFO

i2c:
  sda: GPIO22
  scl: GPIO20
  frequency: 400kHz
  # At 400kHz a full transaction (status + data read) takes <2ms. 50ms gives
  # 25x headroom for clock-stretching while failing fast on a locked bus instead
  # of blocking the main loop for 500ms-2s (ESP-IDF default is ~1s).
  timeout: 50ms

switch:
  - platform: gpio
    id: neopixel_i2c_power
    name: "NeoPixel I2C Power"
    pin: GPIO2
    restore_mode: ALWAYS_ON

light:
  - platform: esp32_rmt_led_strip
    id: status_light
    rgb_order: GRB
    chipset: WS2812
    pin: 0
    num_leds: 1
    name: "Status Light"

output:
  - platform: gpio
    id: red_light
    pin: GPIO13

globals:
  - id: g_led_state
    type: int
    restore_value: false
    initial_value: '0'

  # True while an event is active. Prevents repeated flashes on every 64ms
  # sample during a single door event. Cleared on the falling edge (value=0).
  - id: g_event_active
    type: bool
    restore_value: false
    initial_value: 'false'

esphome:
  on_boot:
    priority: -100   # after NVS globals are restored
    then:
      - script.execute: led_refresh

interval:
  # Keeps idle colour current (orange/cyan transition as state changes).
  # Skipped while g_led_state != 0 so it cannot disturb event or OTA colours.
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return id(g_led_state) == 0;'
          then:
            - script.execute: led_refresh

script:
  # ── Central LED controller ─────────────────────────────────────────────────
  # Reads g_led_state and applies the correct colour to status_light.
  # mode: restart lets OTA immediately override any in-progress flash.
  - id: led_refresh
    mode: restart
    then:
      - lambda: |-
          auto call = id(status_light).make_call();
          call.set_state(true);
          call.set_brightness(0.5f);
          switch (id(g_led_state)) {
            case 1:  // EVENT_POSITIVE — green (door open)
              call.set_red(0.0f); call.set_green(1.0f); call.set_blue(0.0f);
              call.set_transition_length(0);
              break;
            case 2:  // EVENT_NEGATIVE — blue (door close)
              call.set_red(0.0f); call.set_green(0.0f); call.set_blue(1.0f);
              call.set_transition_length(0);
              break;
            case 3:  // OTA — purple
              call.set_red(0.6f); call.set_green(0.0f); call.set_blue(1.0f);
              call.set_transition_length(0);
              break;
            default:  // 0 = IDLE
              call.set_brightness(0.2f);
              if (!id(g_provisioned)) {
                // Unprovisioned devices show orange to prompt provisioning.
                call.set_red(1.0f); call.set_green(0.45f); call.set_blue(0.0f);
                call.set_transition_length(0);
              } else {
                // Provisioned devices show cyan when idle. Transition smoothly from orange on provisioning.
                call.set_red(0.0f); call.set_green(1.0f); call.set_blue(1.0f);
                call.set_transition_length(500);
              }
              break;
          }
          call.perform();

  # ── Event-flash return timer ───────────────────────────────────────────────
  # Started on every event rising edge. Returns LED to idle after the burst.
  # mode: restart resets the 300ms window if a second event fires within it.
  - id: led_event_timer
    mode: restart
    then:
      - delay: 300ms
      - globals.set:
          id: g_led_state
          value: '0'
      - script.execute: led_refresh

  # ── MQTT discovery ─────────────────────────────────────────────────────────
  # Called by air-alarm-identity.yaml on provision / MQTT reconnect.
  # Returns LED to idle (cyan for a freshly-provisioned, online device).
  - id: publish_mqtt_discovery
    mode: single
    then:
      - globals.set:
          id: g_led_state
          value: '0'
      - script.execute: led_refresh
      - script.execute: publish_ens220_discovery
