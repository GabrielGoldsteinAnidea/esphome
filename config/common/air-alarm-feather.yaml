# Platform package for Adafruit Feather ESP32 v2 (ESP-IDF framework)
#
# publish_mqtt_discovery delegates entirely to publish_ens220_discovery since
# the Feather has no onboard temperature/humidity/pressure sensors.

esp32:
  board: adafruit_feather_esp32_v2
  framework:
    type: esp-idf

logger:
  level: INFO
  logs:
    sensor: INFO
    i2c.idf: WARN
    ens220: INFO

i2c:
  sda: GPIO22
  scl: GPIO20
  frequency: 400kHz

switch:
  - platform: gpio
    id: neopixel_i2c_power
    name: "NeoPixel I2C Power"
    pin: GPIO2
    restore_mode: ALWAYS_ON

light:
  - platform: esp32_rmt_led_strip
    id: status_light
    rgb_order: GRB
    chipset: WS2812
    pin: 0
    num_leds: 1
    name: "Status Light"

output:
  - platform: gpio
    id: red_light
    pin: GPIO13

esphome:
  on_boot:
    priority: -100   # after NVS globals are restored
    then:
      - if:
          condition:
            lambda: 'return !id(g_provisioned);'
          then:
            - light.turn_on:
                id: status_light
                red: 1.0
                green: 0.45
                blue: 0.0
                brightness: 0.5
                transition_length: 0s

interval:
  # Maintain idle state: orange when unprovisioned, cyan when provisioned + online.
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return !id(g_provisioned);'
          then:
            - light.turn_on:
                id: status_light
                red: 1.0
                green: 0.45
                blue: 0.0
                brightness: 0.5
                transition_length: 0s
          else:
            - if:
                condition:
                  wifi.connected:
                then:
                  - light.turn_on:
                      id: status_light
                      red: 0.0
                      green: 1.0
                      blue: 1.0
                      brightness: 0.5
                      transition_length: 500ms

script:
  # Single-shot event flashes. mode: single drops re-triggers while running,
  # preventing rapid repeat flashes when the event value stays non-zero over
  # multiple 64ms update cycles. Restores idle colour immediately after.
  - id: event_flash_green
    mode: single
    then:
      - light.turn_on:
          id: status_light
          red: 0.0
          green: 1.0
          blue: 0.0
          brightness: 0.5
          transition_length: 0s
      - delay: 300ms
      - if:
          condition:
            lambda: 'return id(g_provisioned) && id(conn_status).state;'
          then:
            - light.turn_on:
                id: status_light
                red: 0.0
                green: 1.0
                blue: 1.0
                brightness: 0.5
                transition_length: 0s
          else:
            - light.turn_off:
                id: status_light
                transition_length: 0s

  - id: event_flash_blue
    mode: single
    then:
      - light.turn_on:
          id: status_light
          red: 0.0
          green: 0.0
          blue: 1.0
          brightness: 0.5
          transition_length: 0s
      - delay: 300ms
      - if:
          condition:
            lambda: 'return id(g_provisioned) && id(conn_status).state;'
          then:
            - light.turn_on:
                id: status_light
                red: 0.0
                green: 1.0
                blue: 1.0
                brightness: 0.5
                transition_length: 0s
          else:
            - light.turn_off:
                id: status_light
                transition_length: 0s

  - id: publish_mqtt_discovery
    mode: single
    then:
      - light.turn_on:         # switch from orange to cyan on provision
          id: status_light
          red: 0.0
          green: 1.0
          blue: 1.0
          brightness: 0.5
          transition_length: 500ms
      - script.execute: publish_ens220_discovery
