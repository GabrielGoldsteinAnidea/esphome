api:
  encryption:
    key: !secret air-alarm_api_encryption_key

debug:
  update_interval: 5s

http_request:
  useragent: esphome/influxdb
  timeout: 15s
  watchdog_timeout: 15s

influxdb_v2_oss:
  url: !secret influxdb_url
  organization: !secret influxdb_org
  token: !secret influxdb_token
  backlog_max_depth: 60
  backlog_drain_batch: 10
  tags:
    device: ${friendly_name}
  measurements:
    - id: _air_events
      bucket: ${friendly_name}
      name: airevents
      sensors:
        - sensor_id: _uptime
          name: uptime
      binary_sensors:
        - sensor_id: _ens220_event
          name: ens220_event

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

packages:
  #  - !include external_components/esphome-ens220/air-alarm-ens220.yaml
  ens220:
    url: https://github.com/midnight-security/esphome-ens220
    username: gghomeassistant
    password: !secret github_token
    file: air-alarm-ens220.yaml

external_components:
  - source:
      type: git
      url: https://github.com/midnight-security/esphome-ens220
      username: gghomeassistant
      password: !secret github_token
      #      type: local
      #      path: external_components/esphome-ens220/components
    components:
      - ens220
    refresh: always

  - source: github://kpfleming/esphome-influxdb_v2_oss

# Thanks to this configuration for the initial legwork https://github.com/kbx81/esphome-configs/blob/main/dev/esp-funhouse.yaml

esp32:
  board: adafruit_funhouse_esp32s2
  framework:
    type: esp-idf
    #    version: 5.4.2
    #    platform_version: 6.3.2
    # type: arduino
    # version: 2.0.9
    # platform_version: 5.4.0

psram:
  speed: 80MHz

# Enable logging
logger:
  level: INFO
  hardware_uart: USB_CDC
  logs:
    i2c.idf: WARN
    ens220: INFO
    graph: WARN
    ledc: WARN
    st7789v: WARN

ota:
  - platform: esphome
    password: !secret wifi_password_ths

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: esptime
    timezone: EST+5EDT,M3.2.0/2,M11.1.0/2
  - platform: sntp
    id: sntp_time

i2c:
  id: i2c_bus
  frequency: 400kHz
  scl: 33
  sda: 34

spi:
  - id: spi_lcd
    clk_pin: 36
    mosi_pin: 35
  - id: spi_led
    clk_pin: 15
    mosi_pin: 14

status_led:
  pin: 37

font:
  - file: "gfonts://Roboto"
    id: roboto_large
    size: 64
  - file: "gfonts://Roboto"
    id: roboto_med
    size: 28
  - file: "gfonts://Roboto"
    id: roboto_metric
    size: 22
  - file: "gfonts://Roboto"
    id: roboto_small
    size: 12

binary_sensor:
  - platform: status
    name: Status
    id: conn_status

  - platform: gpio
    id: button_input_0
    name: Button Up
    pin:
      number: 5
  - platform: gpio
    id: button_input_1
    name: Button Select
    pin:
      number: 4
    on_press:
      - display.page.show: page1
  - platform: gpio
    id: button_input_2
    name: Button Down
    pin:
      number: 3
    on_press:
      - display.page.show: page2
  - platform: gpio
    id: button_input_back
    name: Button 0
    pin:
      number: 0
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - light.toggle: dotstar_light

color:
  - id: color_heavy_blue
    red: 39.2%
    green: 58.4%
    blue: 92.9%
  - id: color_cool_purple
    red: 50.2%
    green: 0%
    blue: 50.2%
  - id: color_sea_green
    red: 18.0%
    green: 54.5%
    blue: 34.1%
  - id: color_red
    red: 100%
    green: 0%
    blue: 0%
  - id: color_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: color_green
    red: 0%
    green: 100%
    blue: 0%
  - id: color_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: color_gray
    red: 60%
    green: 60%
    blue: 60%
  - id: color_white
    red: 100%
    green: 100%
    blue: 100%
  - id: elec_cost_color
    red: 100%
    green: 0%
    blue: 100%

light:
  - platform: monochromatic
    id: lcd_backlight
    name: Display Backlight
    output: lcd_backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
  - platform: spi_led_strip
    id: dotstar_light
    spi_id: spi_led
    data_rate: 40MHz
    name: APA102 LEDs
    restore_mode: RESTORE_DEFAULT_OFF
    num_leds: 5
    effects:
      - addressable_flicker:
      - addressable_color_wipe:
      - addressable_rainbow:
      - addressable_scan:
      - addressable_twinkle:
      - addressable_random_twinkle:
      - addressable_fireworks:

output:
  - platform: ledc
    id: lcd_backlight_pwm
    pin: 21
    channel: 0
  # Buzzer output
  - platform: ledc
    id: rtttl_out
    pin: 42
    channel: 2

switch:
  - platform: template
    id: auto_dotstar
    name: Auto Light Color
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      then:
        # - rtttl.play: "alert 1:d=16,o=5,b=120:a"
        - light.turn_off: dotstar_light
    on_turn_on:
      then:
        # - rtttl.play: "alert 1:d=16,o=5,b=120:e6"
        - light.turn_on: dotstar_light
        - light.turn_on:
            id: dotstar_light
            effect: Rainbow Effect With Custom Values
number:
  - platform: template
    id: light_brightness
    name: Auto Light Brightness
    optimistic: true
    min_value: 0
    max_value: 1
    step: 0.01
    initial_value: 0.5
    restore_value: true

sensor:
  - id: _uptime
    platform: uptime
    name: ${friendly_name} Uptime
    on_value:
      then:
        - if:
            condition:
              time.has_time:
            then:
              - influxdb.publish: _air_events

  - platform: debug
    # free:
    #   name: "Heap Free"
    # fragmentation:
    #   name: "Heap Fragmentation"
    # block:
    #   name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
    psram:
      name: "Free PSRAM"
    cpu_frequency:
      name: "CPU Frequency"
  - platform: aht10
    temperature:
      id: aht20_temperature
      name: AHT20 Temperature
      filters:
        - offset: -2.0
    humidity:
      id: aht20_humidity
      name: AHT20 Humidity
    update_interval: 30s
  - platform: dps310
    temperature:
      id: dps310_temperature
      name: DPS310 Temperature
      unit_of_measurement: °C
      filters:
        - offset: -2.6
    pressure:
      unit_of_measurement: hPa
      id: dps310_pressure
      name: DPS310 Pressure
      accuracy_decimals: 3
    update_interval: 30s
graph:
  - id: temperature_graph
    sensor: dps310_temperature
    duration: 1h
    border: False
    color: color_heavy_blue
    width: 150
    height: 50
  - id: pressure_graph
    sensor: _ens220_pressure
    duration: 10s
    border: False
    color: color_cool_purple
    width: 150
    height: 50
    max_range: 1

display:
  - platform: st7789v
    id: main_lcd
    spi_id: spi_lcd
    model: Adafruit Funhouse 240x240
    rotation: 180
    data_rate: 80MHz
    # eightbitcolor: true
    # cs_pin: 40
    # dc_pin: 39
    # reset_pin: 41
    update_interval: 1s
    pages:
      - id: page1
        lambda: |-
          const uint8_t header_height = 20;
          const uint8_t vert_spacing_offset = 45;
          const uint8_t vert_center = ((it.get_height() - header_height) / 2) + header_height;
          auto logo_color = id(conn_status).state ? id(color_gray) : id(color_red);
          it.strftime(6, 6, id(roboto_small), id(color_gray), TextAlign::TOP_LEFT, "%Y-%m-%d", id(esptime).now());
          it.strftime((it.get_width() - 6), 6, id(roboto_small), id(color_gray), TextAlign::TOP_RIGHT, "%H:%M:%S", id(esptime).now());
          it.print(it.get_width() / 2, 6, id(roboto_small), logo_color, TextAlign::TOP_CENTER, "ESPHome");
          it.graph(90, 40, id(temperature_graph));
          it.graph(90, 160, id(pressure_graph));
          it.printf(40, 70, id(roboto_metric), id(color_heavy_blue), TextAlign::CENTER, "%.1f°", id(aht20_temperature).state * 1.8 + 32);
          it.printf(40, 130, id(roboto_metric), id(color_sea_green), TextAlign::CENTER, "%.1f%%", id(aht20_humidity).state);
          it.printf(40, 190, id(roboto_metric), id(color_cool_purple), TextAlign::CENTER, "%.1f", id(_ens220_pressure).state);
          it.printf(40, 220, id(roboto_metric), id(color_cool_purple), TextAlign::CENTER, "nhPa");

      #          it.graph(90, 100, id(humidity_graph));

      - id: page2
        lambda: |-
          const uint8_t header_height = 20;
          const uint8_t vert_spacing_offset = 45;
          const uint8_t vert_center = ((it.get_height() - header_height) / 2) + header_height;
          auto logo_color = id(conn_status).state ? id(color_gray) : id(color_red);
          it.strftime(6, 6, id(roboto_small), id(color_gray), TextAlign::TOP_LEFT, "%Y-%m-%d", id(esptime).now());
          it.strftime((it.get_width() - 6), 6, id(roboto_small), id(color_gray), TextAlign::TOP_RIGHT, "%H:%M:%S", id(esptime).now());
          it.print(it.get_width() / 2, 6, id(roboto_small), logo_color, TextAlign::TOP_CENTER, "ESPHome");
          it.printf(it.get_width() / 2, vert_center - vert_spacing_offset, id(roboto_med), id(color_gray), TextAlign::BOTTOM_CENTER, "%.1f hPa", id(_ens220_pressure).state);
          it.printf(it.get_width() / 2, vert_center, id(roboto_large), id(color_white), TextAlign::CENTER, "%.1f°", id(aht20_temperature).state * 1.8 + 32);
          it.printf(it.get_width() / 2, vert_center + vert_spacing_offset, id(roboto_med), id(color_gray), TextAlign::TOP_CENTER, "%.1f%%", id(aht20_humidity).state);
