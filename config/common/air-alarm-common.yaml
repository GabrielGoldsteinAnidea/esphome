api:
  encryption:
    key: !secret air-alarm_api_encryption_key

debug:
  update_interval: 5s

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

packages:
  - !include ens220-source-local.yaml

http_request:
  id: http_req_component
  useragent: esphome-air-alarm

ota:
  - platform: esphome
    password: !secret wifi_password_ths
    on_begin:
      then:
        - light.turn_on:
            id: status_light
            red: 0.6
            green: 0.0
            blue: 1.0
            brightness: 1.0
            transition_length: 0s
  - platform: http_request
    id: ota_http_request
    on_begin:
      then:
        - light.turn_on:
            id: status_light
            red: 0.6
            green: 0.0
            blue: 1.0
            brightness: 1.0
            transition_length: 0s

button:
  - platform: template
    name: "Update Firmware"
    entity_category: diagnostic
    on_press:
      - ota.http_request.flash:
          id: ota_http_request
          url: "http://192.168.4.2:8123/local/esphome/air-alarm.bin"
          md5_url: "http://192.168.4.2:8123/local/esphome/air-alarm.md5"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 120min
  ap:
    ssid: "Air Alarm Fallback"
    password: !secret wifi_password_ths

mqtt:
  id: mqtt_component
  broker: !secret mqtt_ip
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  on_connect:
    then:
      - if:
          condition:
            lambda: 'return id(g_provisioned);'
          then:
            - script.execute: publish_mqtt_discovery

time:
  - platform: homeassistant
    id: esptime
    timezone: EST+5EDT,M3.2.0/2,M11.1.0/2
  - platform: sntp
    id: sntp_time
    servers:
      - homeassistant.mgmt    # local HA/Chrony server for better accuracy than pool
    update_interval: 30s      # was 15min default; limits inter-sync drift
    on_time_sync:
      then:
        - logger.log:
            level: INFO
            format: "SNTP time synchronized"

binary_sensor:
  - platform: status
    name: Status
    id: conn_status

sensor:
  - platform: debug
    loop_time:
      name: "Loop Time"

switch:
  - platform: restart
    name: "Restart"

script:
  # Fired once per second at the boundary. The 500ms delay uses the RTOS
  # timer, so turn-off accuracy is independent of the poll interval.
  - id: red_light_pulse
    mode: single   # ignore re-entry if previous pulse is still running
    then:
      - output.turn_on: red_light
      - delay: 500ms
      - output.turn_off: red_light

interval:
  # 1ms poll — only acts on the rising edge of each SNTP second.
  # Accuracy: ±loop_time on the turn-on edge, RTOS-timer accuracy on turn-off.
  - interval: 1ms
    then:
      - lambda: |-
          if (!id(conn_status).state) {
            id(red_light).turn_off();
            return;
          }
          static uint32_t last_second = UINT32_MAX;
          struct timeval tv;
          gettimeofday(&tv, nullptr);
          uint32_t sec = (uint32_t)tv.tv_sec;
          if (sec != last_second) {
            last_second = sec;
            id(red_light_pulse).execute();
          }
