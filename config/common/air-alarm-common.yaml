api:
  encryption:
    key: !secret air-alarm_api_encryption_key

debug:
  update_interval: 5s

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

packages:
  - !include ens220-source-local.yaml

ota:
  - platform: esphome
    password: !secret wifi_password_ths

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 120min
  ap:
    ssid: "Air Alarm Fallback"
    password: !secret wifi_password_ths

mqtt:
  id: mqtt_component
  broker: !secret mqtt_ip
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  on_connect:
    then:
      - if:
          condition:
            lambda: 'return id(g_provisioned);'
          then:
            - script.execute: publish_mqtt_discovery

time:
  - platform: homeassistant
    id: esptime
    timezone: EST+5EDT,M3.2.0/2,M11.1.0/2
  - platform: sntp
    id: sntp_time
    servers:
      - homeassistant.mgmt    # local HA/Chrony server for better accuracy than pool
    update_interval: 30s      # was 15min default; limits inter-sync drift
    on_time_sync:
      then:
        - logger.log:
            level: INFO
            format: "SNTP time synchronized"

binary_sensor:
  - platform: status
    name: Status
    id: conn_status

sensor:
  - platform: debug
    loop_time:
      name: "Loop Time"

switch:
  - platform: restart
    name: "Restart"

interval:
  - interval: 1s
    then:
      if:
        condition:
          wifi.connected:
        then:
          - output.turn_on: red_light
          - delay: 500ms
          - output.turn_off: red_light
        else:
          - output.turn_off: red_light
