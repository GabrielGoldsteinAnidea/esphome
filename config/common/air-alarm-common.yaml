api:
  encryption:
    key: !secret air-alarm_api_encryption_key

debug:
  update_interval: 5s

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

packages:
#  - !include ../external_components/esphome-ens220/air-alarm-ens220.yaml
  ens220:
    url: https://github.com/midnight-security/esphome-ens220
    username: gghomeassistant
    password: !secret github_token
    file: air-alarm-ens220.yaml

external_components:
  - source:
      type: git
      url: https://github.com/midnight-security/esphome-ens220
      username: gghomeassistant
      password: !secret github_token
      # type: local
      # path: external_components/esphome-ens220/components
    components:
      - ens220
    refresh: always

ota:
  - platform: esphome
    password: !secret wifi_password_ths

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: esptime
    timezone: EST+5EDT,M3.2.0/2,M11.1.0/2
  - platform: sntp
    id: sntp_time

binary_sensor:
  - platform: status
    name: Status
    id: conn_status

sensor:
  - id: _uptime
    platform: uptime
    name: ${friendly_name} Uptime
    # on_value:
    #   then:
    #     - if:
    #         condition:
    #           time.has_time:
    #         then:
    #           - influxdb.publish: _air_events

  # - platform: debug
    # free:
    #   name: "Heap Free"
    # fragmentation:
    #   name: "Heap Fragmentation"
    # block:
    #   name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
    # psram:
    #   name: "Free PSRAM"
    cpu_frequency:
      name: "CPU Frequency"

switch:
  - platform: restart
    name: "Restart"

interval:
  - interval: 1s
    then:
      if:
        condition:
          wifi.connected:
        then:
          - output.turn_on: red_light
          - delay: 500ms
          - output.turn_off: red_light
        else:
          - output.turn_off: red_light
