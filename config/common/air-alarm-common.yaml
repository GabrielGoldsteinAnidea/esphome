api:
  encryption:
    key: !secret air-alarm_api_encryption_key

debug:
  update_interval: 5s

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

packages:
  - !include ens220-source.yaml

ota:
  - platform: esphome
    password: !secret wifi_password_ths

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esphome:
  includes:
    - common/sntp_smooth.h   # brings esp_sntp.h into lambda scope
  on_boot:
    priority: -100   # after network and SNTP init
    then:
      - lambda: |-
          // Use smooth mode so corrections are applied as a slow drift rate
          // rather than an instant jump, which would corrupt the derivative
          // calculation in the ENS220 event detection algorithm.
          #ifdef USE_ESP32
          esp_sntp_set_sync_mode(SNTP_SYNC_MODE_SMOOTH);
          #endif

time:
  - platform: homeassistant
    id: esptime
    timezone: EST+5EDT,M3.2.0/2,M11.1.0/2
  - platform: sntp
    id: sntp_time
    servers:
      - homeassistant.mgmt    # local HA/Chrony server for better accuracy than pool
    update_interval: 30s      # was 15min default; limits inter-sync drift

binary_sensor:
  - platform: status
    name: Status
    id: conn_status

sensor:
  - platform: debug
    # free:
    #   name: "Heap Free"
    # fragmentation:
    #   name: "Heap Fragmentation"
    # block:
    #   name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
    # psram:
    #   name: "Free PSRAM"
    # cpu_frequency:
    #   name: "CPU Frequency"

switch:
  - platform: restart
    name: "Restart"

interval:
  - interval: 1s
    then:
      if:
        condition:
          wifi.connected:
        then:
          - output.turn_on: red_light
          - delay: 500ms
          - output.turn_off: red_light
        else:
          - output.turn_off: red_light
