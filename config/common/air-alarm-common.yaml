api:
  encryption:
    key: !secret air-alarm_api_encryption_key

debug:
  update_interval: 5s

logger:
  level: DEBUG
  logs:
    # Suppress high-frequency noise so only meaningful messages get through
    mqtt: WARN
    mqtt.component: WARN
    sensor: WARN
    binary_sensor: WARN
    light: WARN
    interval: WARN
    script: WARN
  on_message:
    level: WARN
    then:
      - if:
          condition:
            lambda: 'return id(g_provisioned);'
          then:
            - mqtt.publish:
                topic: !lambda |-
                  return "esphome/" + id(g_device_id) + "-"
                         + str_sprintf("%d", id(g_device_num)) + "/log";
                payload: !lambda 'return message;'

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

packages:
  - !include ens220-source-local.yaml

http_request:
  id: http_req_component
  useragent: esphome-air-alarm

ota:
  # Dashboard push OTA: on_begin fires synchronously then OTA blocks the loop.
  # call.perform() marks the state dirty; loop() forces the actual hardware
  # write before the loop is taken over, so purple appears immediately.
  - platform: esphome
    password: !secret wifi_password_ths
    on_begin:
      then:
        - lambda: |-
            id(g_led_state) = 3;
            auto call = id(status_light).make_call();
            call.set_red(0.6f); call.set_green(0.0f); call.set_blue(1.0f);
            call.set_brightness(0.5f); call.set_state(true);
            call.set_transition_length(0);
            call.perform();
            id(status_light).loop();
  - platform: http_request
    id: ota_http_request

button:
  - platform: template
    name: "Update Firmware"
    entity_category: diagnostic
    on_press:
      # Set purple and flush to hardware first, then pause long enough for the
      # LED strip to visibly show the colour before OTA blocks the main loop.
      - lambda: |-
          id(g_led_state) = 3;
          auto call = id(status_light).make_call();
          call.set_red(0.6f); call.set_green(0.0f); call.set_blue(1.0f);
          call.set_brightness(0.5f); call.set_state(true);
          call.set_transition_length(0);
          call.perform();
          id(status_light).loop();
      - delay: 500ms
      - ota.http_request.flash:
          id: ota_http_request
          url: "http://192.168.4.2:8123/local/esphome/air-alarm.bin"
          md5_url: "http://192.168.4.2:8123/local/esphome/air-alarm.md5"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 120min
  ap:
    ssid: "Air Alarm Fallback"
    password: !secret wifi_password_ths

mqtt:
  id: mqtt_component
  broker: !secret mqtt_ip
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  on_connect:
    then:
      # Brief delay so the broker finishes processing the CONNACK before we
      # flood it with retained discovery messages.
      - delay: 2s
      - if:
          condition:
            lambda: 'return id(g_provisioned);'
          then:
            - script.execute: publish_mqtt_discovery

globals:
  - id: g_sntp_synced
    type: bool
    restore_value: false
    initial_value: 'false'

  # millis() of the last successful SNTP sync. Used by the watchdog interval
  # to detect sync failure and clear g_sntp_synced if 120s elapse without
  # a successful sync (4× the 30s update_interval).
  - id: g_sntp_last_sync_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

time:
  - platform: homeassistant
    id: esptime
    timezone: EST+5EDT,M3.2.0/2,M11.1.0/2
  - platform: sntp
    id: sntp_time
    servers:
      - homeassistant.mgmt    # local HA/Chrony server for better accuracy than pool
    update_interval: 30s      # was 15min default; limits inter-sync drift
    on_time_sync:
      then:
        - lambda: |-
            bool first_sync = !id(g_sntp_synced);
            id(g_sntp_synced) = true;
            id(g_sntp_last_sync_ms) = millis();
            if (!id(g_provisioned)) {
              ESP_LOGI("sntp", "SNTP time synchronized (not provisioned, skipping MQTT)");
              return;
            }
            std::string base = "esphome/" + id(g_device_id) + "-"
                               + str_sprintf("%d", id(g_device_num));
            id(mqtt_component)->publish(base + "/sntp_synced", std::string("true"), 0, true);

            // Publish time_sync immediately on first sync so HA shows a value
            // without waiting up to 5 minutes for the next :00/:05/... mark.
            if (first_sync) {
              struct timeval tv;
              gettimeofday(&tv, nullptr);
              char ts[32];
              strftime(ts, sizeof(ts), "%Y-%m-%dT%H:%M:%S", gmtime(&tv.tv_sec));
              sprintf(ts + strlen(ts), ".%03ldZ", tv.tv_usec / 1000);
              id(mqtt_component)->publish(base + "/time_sync", std::string(ts), 0, false);
              ESP_LOGI("sntp", "SNTP first sync — time_sync: %s", ts);
            } else {
              ESP_LOGI("sntp", "SNTP time synchronized");
            }

    # Publish time_sync at exact 5-minute wall-clock boundaries so all devices
    # report simultaneously. Compare timestamps across devices to detect drift.
    # Milliseconds in the string show sub-second loop-timing jitter per device.
    on_time:
      - seconds: 0
        minutes: /5
        then:
          - lambda: |-
              if (!id(g_provisioned) || !id(g_sntp_synced)) return;
              struct timeval tv;
              gettimeofday(&tv, nullptr);
              char ts[32];
              strftime(ts, sizeof(ts), "%Y-%m-%dT%H:%M:%S", gmtime(&tv.tv_sec));
              sprintf(ts + strlen(ts), ".%03ldZ", tv.tv_usec / 1000);
              std::string topic = "esphome/" + id(g_device_id) + "-"
                                  + str_sprintf("%d", id(g_device_num)) + "/time_sync";
              id(mqtt_component)->publish(topic, std::string(ts), 0, false);
              ESP_LOGI("sntp", "time_sync: %s", ts);

binary_sensor:
  - platform: status
    name: Status
    id: conn_status

sensor:
  - platform: debug
    loop_time:
      name: "Loop Time"

interval:
  # SNTP watchdog — fires every 60s. If 120s have elapsed since the last
  # successful sync (and we were previously synced), mark as unsynced and
  # push "false" to the retained MQTT topic so HA sees the failure.
  # 120s = 4× the 30s update_interval, tolerating one missed sync cycle.
  - interval: 60s
    then:
      - lambda: |-
          if (!id(g_sntp_synced)) return;
          if ((millis() - id(g_sntp_last_sync_ms)) < 120000) return;
          id(g_sntp_synced) = false;
          ESP_LOGW("sntp", "SNTP sync timeout — no sync in 120s, marking unsynced");
          if (!id(g_provisioned)) return;
          std::string topic = "esphome/" + id(g_device_id) + "-"
                              + str_sprintf("%d", id(g_device_num)) + "/sntp_synced";
          id(mqtt_component)->publish(topic, std::string("false"), 0, true);

  # Red LED SNTP heartbeat.
  #
  # OLD approach (removed): detect second boundary → execute mode:single script
  # → 500ms RTOS delay → turn off. Problem: the RTOS delay starts from whenever
  # the boundary was detected (±loop_time), so the off-edge drifts independently
  # of wall-clock. Any loop-time variation shifts the entire on-period.
  #
  # NEW approach: poll wall-clock every 1ms and drive the LED directly based on
  # tv_usec. The LED is ON for the first 500ms of each second (tv_usec < 500000)
  # and OFF for the second 500ms. This is self-correcting — a late poll produces
  # a brief glitch, but the very next poll restores the correct state. All devices
  # running SNTP-synced clocks compute the same tv_usec and therefore drive their
  # LEDs in lockstep regardless of individual loop-time variation.
  - interval: 1ms
    then:
      - lambda: |-
          if (!id(conn_status).state || !id(g_sntp_synced)) {
            id(red_light).turn_off();
            return;
          }
          struct timeval tv;
          gettimeofday(&tv, nullptr);
          if (tv.tv_usec < 500000) {
            id(red_light).turn_on();
          } else {
            id(red_light).turn_off();
          }
