preferences:
  flash_write_interval: 2min

# captive_portal:

improv_serial:

# Enable logging
logger:

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
  - platform: factory_reset
    name: Wipe Preferences
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: Wi-Fi Signal
    entity_category: diagnostic
    # 15s caused 100-500ms main-loop stalls — the WiFi driver call is synchronous.
    # 60s reduces blocking frequency 4x with no meaningful loss of diagnostic value.
    update_interval: 60s

  - id: _uptime
    platform: uptime
    name: Uptime

esphome:
  on_boot:
    priority: -200
    then:
      - component.update: firmware_version_sensor

text_sensor:
  - platform: template
    name: "Firmware Version"
    id: firmware_version_sensor
    entity_category: diagnostic
    icon: mdi:tag
    lambda: 'return {"${firmware_version}"};'
    update_interval: never
