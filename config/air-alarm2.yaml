# Adafruit Funhouse (ESP32-S2) — flash this same binary to units 1 and 2.
# Identity (device_id, device_num, location) is set at runtime via the
# esphome.<mac-name>.provision service call from HA Developer Tools.

esphome:
  name: air-alarm
  friendly_name: Air Alarm
  name_add_mac_suffix: true

packages:
  - !include common/air-alarm-feather.yaml
  - !include common/air-alarm-common.yaml
  - !include common/esp_common_core.yaml
  - !include common/air-alarm-identity.yaml
