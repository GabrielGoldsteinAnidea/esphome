esphome:
  name: coffee-maker
  friendly_name: "Coffee Maker"

esp8266:
  board: huzzah
  framework:
    version: 3.0.2

# Enable logging
logger:
  level: DEBUG
  baud_rate: 115200

# # UART Serial Configuration
# uart:
#   - id: uart_0
#     tx_pin: GPIO1
#     rx_pin: GPIO3
#     baud_rate: 115200

# Enable Home Assistant API
api:
  encryption:
    key: !secret coffee-maker_api_encryption_key

ota:
  - platform: esphome
    password: !secret wifi_password_ths

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Coffee-Maker Fallback Hotspot"
    password: !secret wifi_password_ths

# Disable web server and captive portal to avoid ESP8266 WiFi header conflicts
# captive_portal:
# web_server:

# Binary Sensor definitions (required by component)
binary_sensor:

# Sensor definitions (required by component)
sensor:

switch:
  - platform: restart
    name: "Coffee Maker Restart"

# I2C Bus Configuration
i2c:
  id: bus_a
  sda: GPIO4  # D2 pin on Adafruit Huzzah
  scl: GPIO5  # D1 pin on Adafruit Huzzah
  scan: true
  frequency: 400kHz

# SPI Bus (if needed for displays or other peripherals)
# spi:
  #   id: spi_bus
  #   clk_pin: GPIO14   # D5
  #   mosi_pin: GPIO13  # D7
  #   miso_pin: GPIO12  # D6

# Coffee Maker Component
external_components:
  - source:
      type: local
      path: external_components/esphome-toybox/components
    components: [coffee_maker]

coffee_maker:
  i2c_id: bus_a
  address: 0x18
  update_interval: 100ms

  # GPIO Pin Configuration (interrupt-driven clocked receiver)
  # Pin numbers (integers) for ESP8266: D0-D8 = GPIO16,GPIO5,GPIO4,GPIO0,GPIO2,GPIO14,GPIO12,GPIO13,GPIO15
  # https://cdn-learn.adafruit.com/assets/assets/000/139/874/original/adafruit_products_Huzzah_ESP8266_Pinout_v1.png?1758656732
  pin_clock: GPIO14         # brown wire top  # D6 - Clock input (triggers on rising edge)
  pin_data: GPIO13          # orange wire top # D7 - Data input (read on each clock pulse)
  pin_strobe: GPIO12        # yellow wire top # D5 - Strobe input (signals frame end, triggers on rising edge)
  pin_buttons_a: GPIO15     # yellow wire (1cup, decaccification)
  pin_buttons_b: GPIO2      # orange wire (2cup, Premachinio)
  pin_button_onoff: GPIO16  # white wire  (on/off, hotwater)
  enable:
    name: "Coffee Maker Enable"

  # Binary Sensors
  one_cup_ready:
    name: "One Cup Ready"
    id: one_cup_ready

  two_cup_ready:
    name: "Two Cup Ready"
    id: two_cup_ready

  hot_water:
    name: "Hot Water"
    id: hot_water

  water_empty:
    name: "Water Empty"
    id: water_empty
    device_class: problem

  grounds_full:
    name: "Grounds Full"
    id: grounds_full
    device_class: problem

  error:
    name: "Error"
    id: error_state
    device_class: problem

  decalcification_needed:
    name: "Decalcification Needed"
    id: decalc_needed
    device_class: problem

  grind_disabled:
    name: "Grind Disabled"
    id: grind_disabled
    device_class: problem

  # Sensors
  coffee_quantity:
    name: "Coffee Quantity"
    id: coffee_qty
    unit_of_measurement: cups
    accuracy_decimals: 1

  coffee_flavor:
    name: "Coffee Flavor"
    id: coffee_flav
    accuracy_decimals: 0

# Optional: Add any additional automations or scripts
# automation:
